# Test and package every pull request. Publish and approve releases from main.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: tilezen-zip
          path: release/*.zip
      - name: Upload and approve on dingn
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DINGN_UPLOAD_KEY: ${{ secrets.DINGN_UPLOAD_KEY }}
          DINGN_REVIEW_KEY: ${{ secrets.DINGN_REVIEW_KEY }}
        run: |
          if [ -z "$DINGN_UPLOAD_KEY" ]; then
            echo "::warning::No DINGN_UPLOAD_KEY secret yet, so nothing was published. See README.md."
            exit 0
          fi
          npm run upload
